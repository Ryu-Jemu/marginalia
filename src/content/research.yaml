# authorPosition is stored as {index, of} rather than as prose, so the position
# is rendered mechanically and cannot drift into a different claim.
#
# `materials` point at files the site serves itself:
#   kind: pdf     -> public/papers/<file>.pdf
#   kind: figure  -> src/assets/papers/<file>.(png|jpg|webp)
# An entry whose file is not there yet is skipped at build time rather than
# failing, so the record can be written before the file arrives.

- id: ask-2026
  title: >-
    Dynamic Pricing Optimization for 5G Network Slicing via Three-Part Tariff
    using Reinforcement Learning
  venue: KIPS ASK 2026 spring conference
  authorPosition: { index: 1, of: 2 }
  status: accepted
  date: "2026.05"
  manuscriptId: C2026A0229
  grant: NRF RS-2024-00336983
  award: Silver award, paper competition
  summary: >-
    Optimised three-part tariffs for two network slices while modelling price-driven customer churn.
    Algorithm comparisons and a discount-factor control test the effect of considering long-term rewards.
  role:
    - "Formulated the problem: two slices priced under a subscription fee, an included allowance and an overage rate, with churn responding to price."
    - Built the simulation environment, its demand and churn dynamics, and its calibration.
    - Ran every experiment — the churn-sensitivity sweep, the algorithm comparison at m=1, and the myopic control.
    - Wrote the paper and prepared the submission.
  method:
    - Compared revenue with a max-price baseline at churn sensitivities m=1, 3, 5 and 10.
    - Compared PPO, SAC and TD3 at m=1 using the same environment and three seeds.
    - Used Myopic-PPO with a discount factor of zero to isolate the effect of considering future rewards.
    - Calculated each slice's contribution to the total revenue difference.
  findings:
    - Against a max-price baseline the policy gains 2.1% at m=1, 105.8% at m=3, 195.8% at m=5 and 363.2% at m=10. Each of m=3, 5 and 10 is significant at p<0.001.
    - 97% of the m=3 revenue gap comes from the eMBB slice alone, and eMBB retention holds at 88.8% against the baseline's 3.3%.
    - Myopic-PPO did not differ significantly from the baseline at any tested m. This supports the interpretation that considering long-term rewards contributes to the revenue advantage.
    - At m=1 the net rewards are PPO 7,334, SAC 7,370 and TD3 6,862, against Max-Price 7,183 — the deterministic method is 6.4% below PPO, and SAC is indistinguishable from it at p=0.938.
  implementation:
    project: network-pricing
    summary: >-
      The simulation environment and every experiment in the paper, written as
      one repository.
    points:
      - Two slices priced under a three-part tariff — subscription fee, included allowance, overage rate — inside a Gymnasium environment whose churn responds to the price the policy sets.
      - Configured PPO, SAC and TD3 to use the same environment and three seeds.
      - Implemented Myopic-PPO with a zero discount factor as a control that learns from immediate rewards only.
      - Aggregated revenue by slice and visualised each slice's contribution to the total difference.
  materials:
    - kind: pdf
      src: /papers/ask-2026.pdf
      label: Paper (PDF)
      caption: KIPS ASK 2026 spring conference, C2026A0229.
    - kind: link
      src: https://github.com/Ryu-Jemu/network-pricing
      label: Environment and experiment code
  highlights:
    - Revenue uplift over the max-price baseline grew with churn sensitivity; the difference at m=1 was not significant.
    - Myopic-PPO, trained on immediate rewards only, did not differ significantly from the max-price baseline.
    - The slice-level decomposition attributed 97% of the m=3 revenue gap to eMBB.
  notes:
    - rl-uplift
    - rl-embb-attribution

- id: ieee-tai-survey
  title: Large language model-based optimisation for wireless communication — a survey
  venue: IEEE Transactions on Artificial Intelligence
  authorPosition: { index: 4, of: 7 }
  status: under-review
  date: "2026.08"
  manuscriptId: TAI-2026-Aug-R-01847
  contribution: Section III.E — Beam Prediction
  summary: >-
    A survey of language-model approaches to wireless resource problems, with
    my contribution focused on the beam-prediction section and its model implementation.
  role:
    - Wrote Section III.E, Beam Prediction — the section's argument, taxonomy of approaches and discussion.
    - Described beam sequences as time-series inputs and reviewed language-model approaches to forecasting them.
    - Implemented the DeepMIMO preprocessing pipeline, BP-LLM model, training loop and cascaded LSTM baseline.
    - Reviewed and corrected the manuscript, including three references whose identifiers pointed at unrelated papers.
  method:
    - Beam indices and departure angles are patched and embedded, then reprogrammed into prototype tokens drawn from the model's vocabulary.
    - A prompt prefix carries domain knowledge, the task description and statistics of the input sequence.
    - GPT-2 stays frozen while the embedding, reprogramming layers and output projection are trained with mean squared error.
    - The local implementation contains a training loop and LSTM baseline; it does not implement a held-out evaluation split.
  highlights:
    - Section III.E authorship and a taxonomy of beam-prediction approaches.
    - DeepMIMO preprocessing, patch embedding, token reprogramming and prompt-prefix conditioning.
    - Manuscript and reference-identifier review.
  implementation:
    project: bp-llm
    summary: >-
      A frozen GPT-2 reprogrammed for millimetre-wave beam sequences, with
      preprocessing and training implemented from the DeepMIMO data onward.
    points:
      - "The preprocessing run converted 378 ray-traced sets from DeepMIMO o1_28 at 28 GHz into 84,019 sliding windows, each with forty past steps and ten future steps. A Saleh-Valenzuela channel model and 32-point DFT codebook provide the beam labels."
      - Reversible normalisation, patch embedding and cross-variable attention connect beam index and departure angle to 256 text prototypes around a frozen GPT-2.
      - "The logged training run used 20,000 of the generated samples and 339,338 trainable parameters. Epoch-mean training loss fell from 2.0826 to 0.0009 over ten epochs, taking 34 minutes on Apple silicon."
      - The cascaded LSTM baseline shares the preprocessing and training harness.
      - Normalisation statistics and training loss use the same indices. No held-out split or evaluation metrics are implemented, so the training loss does not measure prediction quality.
  notes:
    - ieee-position
    - ieee-beam-section
    - beam-reprogramming
    - bp-llm-training
    - bp-llm-data
