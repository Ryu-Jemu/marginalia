# ── Dartoo ────────────────────────────────────────────────────────────────

- id: dartoo-publisher-gap
  kind: measurement
  body: >-
    포트폴리오 측정 기록의 적재는 959건, 발행은 805건으로 차이는 154건입니다.
  condition: >-
    2026-08-13 측정 기록에 담긴 결함 발견 당시 실행의 적재·발행 대조입니다.
    새 실행 결과가 아닌 당시 기록입니다.

- id: dartoo-e2e-parity
  kind: measurement
  body: >-
    lazy-reconnect 수정 후 기록된 E2E 실행에서 적재 3,948건, 발행 이벤트
    3,948건이 나왔습니다.
  condition: >-
    2026-08-13 측정 기록의 수정 후 단일 fixture E2E 실행입니다.
    적재·발행 건수를 대조한 값이며 처리량 측정치는 아닙니다.

- id: dartoo-test-count
  kind: measurement
  body: >-
    직접 담당한 세 서비스의 테스트 함수 정의 319개입니다. ingestion 110,
    notification 156, disclosure 53건입니다.
  condition: >-
    세 저장소의 tests/ 아래 def test_ 함수 개수이며, virtualenv는 제외하고
    2026-08-13에 기록했습니다. 실행 통과 건수가 아닌 함수 정의 수입니다.

- id: dartoo-not-ready-experiment
  kind: measurement
  body: >-
    재시도 카운터가 영구 실패로 처리한 공시 4건이 일주일 뒤 재요청에서 정상
    응답을 반환했습니다.
  condition: >-
    2026-04-08 실험 기록에서 2026-04-01 실패 처리한 접수번호 4건을
    같은 상위 endpoint에 다시 요청했습니다.

- id: dartoo-normaliser
  kind: scope
  body: >-
    수집 producer가 ZIP·HTML·XML을 구분하고 인코딩 후보·레거시 별칭을
    정리해 본문과 선언부를 UTF-8로 맞춥니다. 후속 태스크에 객체 경로와
    파일 메타데이터를 전달합니다.

- id: dartoo-ownership
  kind: scope
  body: >-
    수집·공시·알림 구현과 공동 개발한 요약 서비스의 연동·안정화에 기여했습니다.
    별도 Java User 작업은 내부 알림 API와 구조화 페이로드 필드입니다.

- id: dartoo-notification-scope
  kind: scope
  body: >-
    SHA-256 이벤트 키, 10단계 오케스트레이션, TTL 7일의 DLQ는 알림 서비스에
    한정됩니다. 키는 이벤트 유형·접수번호·시각을 포함하며 외부 푸시의
    exactly-once 보장을 뜻하지 않습니다.

- id: dartoo-lua-scope
  kind: scope
  body: >-
    요약 서비스가 Redis Lua로 INCR·EXPIRE를 묶어 클라이언트 호출 사이의
    간격을 제거합니다. Asia/Seoul 시간을 사용하며 Redis 오류 시 처리를 허용합니다.

- id: dartoo-award
  kind: source
  body: >-
    한양대학교 SW/ICT/AI 학술대회 IT/CSE 응용연구개발 부문 대상, 2025년 12월.
  href: https://dartoo.co.kr

