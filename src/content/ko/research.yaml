- id: ask-2026
  title: >-
    강화학습 기반 5G 네트워크 슬라이싱의 Three-Part Tariff 동적 가격 최적화
  venue: 한국정보처리학회 ASK 2026 춘계학술발표대회
  authorPosition: { index: 1, of: 2 }
  status: accepted
  date: "2026.05"
  manuscriptId: C2026A0229
  grant: NRF RS-2024-00336983
  award: 우수논문 은상
  summary: >-
    3부 요금제로 두 네트워크 슬라이스의 가격을 정하되 그 가격이 유발하는 이탈을
    함께 반영하고, 미래를 내다보는 능력의 기여와 학습 알고리즘의 기여를 분리합니다.
  role:
    - "문제를 정식화했습니다: 구독료, 기본 제공량, 초과 요금으로 두 슬라이스의 가격을 정하고 이탈이 가격에 반응하도록 두었습니다."
    - "시뮬레이션 환경과 그 수요·이탈 동역학, 보정을 만들었습니다."
    - "이탈 민감도 스윕, m=1에서의 알고리즘 비교, 근시안 대조군까지 모든 실험을 수행했습니다."
    - "논문을 쓰고 투고를 준비했습니다."
  method:
    - "이탈 민감도 계수 m을 고정하지 않고 스윕하므로, 결과는 단일 수치가 아니라 곡선입니다."
    - "PPO, SAC, TD3를 같은 환경과 같은 세 개의 시드에서 m=1로 비교합니다."
    - "대조군은 할인율을 0으로 둔 같은 알고리즘입니다. 학습은 하되 앞을 내다보지 못합니다."
    - "수익을 슬라이스별로 분해하므로 총합 수치가 한쪽 슬라이스만의 결과를 가릴 수 없습니다."
  findings:
    - "최대 가격 기준선 대비 정책의 이득은 m=1에서 2.1%, m=3에서 105.8%, m=5에서 195.8%, m=10에서 363.2%입니다. p<0.001에서 유의한 구간은 m≥3뿐입니다."
    - "m=3 수익 격차의 97%가 eMBB 슬라이스 하나에서 나오며, eMBB 유지율은 기준선의 3.3%에 대해 88.8%를 지킵니다."
    - "근시안 대조군은 모든 m에서 기준선과 구별되지 않습니다. 이점이 알고리즘이 아니라 미래를 내다보는 능력에 있음을 뜻합니다."
    - "m=1에서 순 보상은 PPO 7,334, SAC 7,370, TD3 6,862이고 Max-Price는 7,183입니다. 결정론적 기법은 PPO보다 6.4% 낮고, SAC는 p=0.938로 PPO와 구별되지 않습니다."
  implementation:
    project: network-pricing
    summary: >-
      논문의 시뮬레이션 환경과 모든 실험을 하나의 저장소로 작성했습니다.
    points:
      - "구독료, 기본 제공량, 초과 요금으로 이루어진 3부 요금제로 두 슬라이스의 가격을 정하며, Gymnasium 환경의 이탈이 정책이 매긴 가격에 반응합니다."
      - "PPO, SAC, TD3가 같은 환경과 같은 세 개의 시드에서 돌아가므로, 비교 대상은 설정이 아니라 알고리즘입니다."
      - "근시안 대조군은 할인율을 0으로 둔 같은 알고리즘이며, 이것이 학습과 미래를 내다보는 능력을 분리합니다."
      - "그림을 만드는 코드에서 수익을 슬라이스별로 분해하므로, 총합 수치가 한쪽 슬라이스만의 결과를 가릴 수 없습니다."
  materials:
    - kind: pdf
      src: /papers/ask-2026.pdf
      label: 논문 (PDF)
      caption: 한국정보처리학회 ASK 2026 춘계학술발표대회, C2026A0229.
    - kind: link
      src: https://github.com/Ryu-Jemu/network-pricing
      label: 환경 및 실험 코드
  highlights:
    - "이점은 이탈 민감도가 클수록 커지고, 고객이 가격에 둔감한 구간에서는 사라집니다."
    - "앞을 내다보지 않도록 학습시킨 근시안 대조군은 고정 기준선과 구별되지 않습니다."
    - "수익 격차를 슬라이스별로 분해했고, 그 분해는 논문에 실려 있습니다."
  notes:
    - rl-uplift
    - rl-embb-attribution

- id: ieee-tai-survey
  title: 무선 통신을 위한 LLM 기반 최적화 — 서베이
  venue: IEEE Transactions on Artificial Intelligence
  authorPosition: { index: 4, of: 7 }
  status: under-review
  date: "2026.08"
  manuscriptId: TAI-2026-Aug-R-01847
  contribution: III.E절 — 빔 예측
  summary: >-
    전력 제어, 대역폭 할당, 엣지 컴퓨팅, 빔 예측에 이르는 무선 자원 문제에 언어
    모델을 적용한 연구를 정리한 서베이입니다.
  role:
    - "III.E절 빔 예측을 전부 집필했습니다. 절의 논지, 접근 방식의 분류, 논의까지 씁니다."
    - "절이 기대고 있는 재정식화를 논증했습니다. 빔 시퀀스는 시계열이므로 빔 선택은 언어 모델을 겨눌 수 있는 예측 문제이고, 정상성이 없는 단말에서는 LSTM 계열 기준선의 일반화가 멈춥니다."
    - "Figure 7의 사례 연구를 구현했습니다. BP-LLM 모델과 cascaded LSTM 기준선을 모두 구현했고, 정규화 빔포밍 이득을 낸 DeepMIMO 시뮬레이션을 돌렸습니다."
    - "Table V의 추론 오버헤드를 측정했습니다: 두 모델의 지연, 최대 GPU 메모리, 평균 전력, 추론당 에너지입니다."
    - "원고를 검토하고 고쳤습니다. 식별자가 엉뚱한 논문을 가리키던 참고문헌 세 건을 포함합니다."
  method:
    - "빔 인덱스와 출발각을 패치로 나눠 임베딩한 뒤, 모델이 이미 가진 어휘에서 뽑은 프로토타입 토큰으로 재프로그래밍합니다."
    - "조건화는 도메인 지식, 신호 드리프트 같은 통계적 추세, 시차 구조의 세 프리픽스를 데이터 토큰 앞에 이어 붙이는 방식입니다."
    - "백본은 동결한 채 둡니다. 임베딩과 재프로그래밍 계층, 선형 사영만 가중치를 가지며, 학습은 H-스텝 구간의 MSE를 최소화합니다."
    - "비교는 DeepMIMO에서 cascaded LSTM 및 ODE 기준선을 상대로, 1스텝부터 10스텝까지의 예측 구간에 걸쳐 수행합니다."
  findings:
    - "BP-LLM은 모든 예측 구간에서 가장 높은 정규화 빔포밍 이득을 지킵니다. 1스텝에서 cascaded LSTM의 0.878에 대해 0.950이고, 10스텝에서는 0.783에 대해 0.820입니다."
    - "세 모델 모두 예측 구간이 길어질수록 나빠지고, LSTM 기준선에 대한 격차는 그 구간을 지나며 0.072에서 0.037로 좁아집니다."
    - "언어 모델은 추론당 4.73 ms로 1.74 대비 더 걸리고, 최대 메모리는 949.67 MB로 24.73 대비 38배입니다."
    - "전력은 22.55 W로 37.41보다 적게 쓰며, 두 모델 모두 과제가 허용하는 16 ms 예측 주기 안에 끝납니다."
  highlights:
    - "III.E절 빔 예측을 집필했습니다. 빔 시퀀스가 왜 예측 문제인지, 언어 모델이 LSTM에는 없는 무엇을 가져오는지 씁니다."
    - "빔 인덱스와 출발각의 패치 임베딩, 모델이 이미 쥐고 있는 토큰으로의 재프로그래밍, 도메인 지식·과제·시계열 통계에 대한 prompt-as-prefix 조건화를 다뤘습니다."
    - "원고를 검토하고 고쳤습니다. 식별자가 엉뚱한 논문을 가리키던 참고문헌 세 건을 포함합니다."
  implementation:
    project: bp-llm
    summary: >-
      밀리미터파 빔 시퀀스를 위해 동결한 GPT-2를 재프로그래밍한 구현이며,
      DeepMIMO 레이 트레이싱 데이터부터 쌓아 올렸습니다.
    points:
      - "DeepMIMO o1_28 시나리오 28 GHz의 레이 트레이싱 378세트를 Saleh-Valenzuela 모델로 채널 벡터로 바꾸고, 32점 DFT 코드북으로 빔포밍한 뒤 위치마다 arg-max 빔을 레이블로 삼습니다. 과거 40스텝 대 미래 10스텝의 슬라이딩 윈도 84,019개가 나옵니다."
      - "가역 정규화, 패치 임베딩, 빔 인덱스와 출발각에 걸친 교차 변수 어텐션, 256개 텍스트 프로토타입으로의 재프로그래밍, 그리고 도메인 지식과 지시문, 시계열 통계를 담은 프롬프트 프리픽스."
      - "동결한 GPT-2 위에서 학습되는 파라미터는 339,338개입니다. 학습 손실은 첫 에포크에 2.0826에서 0.0084로 떨어졌고 여덟 번째 에포크에 0.0009에 닿았으며, Apple silicon에서 34분이 걸렸습니다."
      - "cascaded LSTM 기준선이 같은 하니스에서 돌아가므로, 두 모델은 두 갈래가 아니라 하나의 파이프라인을 거쳐 비교됩니다."
      - "held-out 분할은 구현하지 않았습니다: 정규화 통계와 손실이 같은 인덱스에서 나오므로, 이것은 학습 곡선이지 예측 품질의 측정이 아닙니다. Figure 7 뒤의 평가는 별도 실행입니다."
  notes:
    - ieee-position
    - ieee-beam-section
    - beam-reprogramming
    - bp-llm-training
