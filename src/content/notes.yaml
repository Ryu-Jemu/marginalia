# ── Dartoo ────────────────────────────────────────────────────────────────

- id: dartoo-publisher-gap
  kind: measurement
  body: >-
    959 rows had been persisted to the disclosure table while the publisher had
    emitted only 805 events. Nothing in the logs marked the 154 missing ones.
  condition: >-
    One day of ingestion, counted by reconciling persisted rows against
    published events.

- id: dartoo-e2e-parity
  kind: measurement
  body: >-
    After the lazy-reconnect fix the same end-to-end run produced 3,948
    persisted rows and 3,948 published events.
  condition: >-
    One end-to-end verification run over that fixture set, counted the same way
    as the gap above.

- id: dartoo-test-count
  kind: measurement
  body: >-
    319 automated tests across the three services I owned: 110 ingestion,
    156 notification, 53 disclosure.
  condition: >-
    Count of def test_ functions under tests/ in those three repositories,
    virtualenvs excluded, measured 2026-08-13.

- id: dartoo-not-ready-experiment
  kind: measurement
  body: >-
    Four disclosures the retry counter had written off as permanent failures
    returned normal responses when re-fetched a week later.
  condition: >-
    Re-fetch of four receipt numbers marked permanently failed on 1 April,
    repeated on 8 April against the same upstream endpoint.

- id: dartoo-normaliser
  kind: measurement
  body: >-
    The document normaliser went from 105 lines to 566 — charset auto-detection,
    a Korean codec priority list, and alias normalisation for legacy encodings.
  condition: >-
    Line count of content_normalizer.py before and after the parsing branch was
    merged.

- id: dartoo-ownership
  kind: scope
  body: >-
    I owned ingestion, disclosure and notification end to end, and implemented
    summary and its wiring to the others. Four services of the system.

- id: dartoo-notification-scope
  kind: scope
  body: >-
    The sha256 idempotency key, the ten-step orchestration and the seven-day TTL
    dead-letter queue are the notification service specifically.

- id: dartoo-lua-scope
  kind: scope
  body: >-
    The Redis Lua atomic counter is the summary service specifically. It
    replaced an INCR and a separate EXPIRE that could leave a key with no expiry.

- id: dartoo-award
  kind: source
  body: >-
    Grand Prize, IT/CSE applied research and development, Hanyang University
    SW/ICT/AI conference, December 2025.
  href: https://dartoo.co.kr

# ── MAP ───────────────────────────────────────────────────────────────────

- id: map-terminal-state
  kind: scope
  body: >-
    A completion event arriving before its own job record let the late
    in_progress write overwrite the terminal state. Three regression tests pin
    the orderings that used to break it.

- id: map-grid-coverage
  kind: measurement
  body: >-
    Only 19 of the 243 district grid points matched a subscribed forecast grid,
    so 92.5% of short-term forecast lookups came back empty.
  condition: >-
    District representative grid points joined against the set of grids the
    poller actually subscribes to, counted across the whole seed table.

- id: map-batch-cap
  kind: measurement
  body: >-
    The gateway accepts at most 20 legs per routing request, so any itinerary
    over 22 stops was rejected whole and drew straight lines instead.
  condition: >-
    Upper bound read from the gateway's own request validator, checked against
    the batch the BFF was sending.

- id: map-rate-limit
  kind: scope
  body: >-
    Re-recommendation is capped at three per itinerary per day by a Redis Lua
    INCR and EXPIREAT, expiring at KST midnight rather than on a rolling window.

- id: map-cache-tiers
  kind: scope
  body: >-
    The gateway cache is two tiers: a Redis L1 in front of a scheduled prefetch
    that warms the external data before anyone asks for it.

- id: map-llm-budget
  kind: scope
  body: >-
    The agent calls the model at most three times per request. Candidates are
    filtered by a deterministic rule engine first, and the model only chooses
    among what survives.

- id: map-tsp
  kind: scope
  body: >-
    Under eight stops the visit order is solved exhaustively — at most 5,040
    permutations. Above that it falls back to nearest-neighbour with 2-opt.

- id: map-ownership
  kind: scope
  body: >-
    I owned the gateway, the recommendation agent, the infrastructure topology
    and the Java BFF. On the Flutter client I contributed features.

# ── Reinforcement learning for 5G pricing ─────────────────────────────────

- id: rl-uplift
  kind: measurement
  body: >-
    Against a max-price baseline the learned policy gains 2.1% at m=1, 105.8% at
    m=3, 195.8% at m=5 and 363.2% at m=10.
  condition: >-
    Simulated environment, churn-sensitivity multiplier m. Only m≥3 is
    significant at p<0.001; the m=1 result is p=0.472.

- id: rl-embb-attribution
  kind: measurement
  body: >-
    97% of the m=3 revenue gap comes from the eMBB slice alone, and eMBB
    retention holds at 88.8% against the baseline's 3.3%.
  condition: >-
    Revenue decomposed by slice over the same runs as the headline comparison.

- id: rl-myopic
  kind: measurement
  body: >-
    A myopic version of the same policy, trained with the discount factor set to
    zero, is indistinguishable from the max-price baseline at every m.
  condition: >-
    Same environment and seeds as the main comparison. This is the control that
    isolates foresight from the learning algorithm.

- id: rl-algorithms
  kind: measurement
  body: >-
    Deterministic TD3 lands 6.5% below the on-policy method, while SAC is
    statistically indistinguishable from it (p=0.938).
  condition: >-
    Same environment, five seeds each, reported so the algorithm choice reads as
    a finding rather than a preference.

- id: rl-award
  kind: source
  body: >-
    First author. Silver award, paper competition, KIPS ASK 2026 spring
    conference. Paper C2026A0229, grant NRF RS-2024-00336983.
  href: https://github.com/Ryu-Jemu/network-pricing

# ── Seoul crime factor analysis ───────────────────────────────────────────

- id: crime-model
  kind: measurement
  body: >-
    Five variables explain 84% of the variation in crime across Seoul's 25
    districts — R² 0.843, adjusted 0.801.
  condition: >-
    OLS across 25 districts, cross-checked with LassoCV and RidgeCV at 5 folds.

- id: crime-significant
  kind: measurement
  body: >-
    Population (p=0.001) and the density of entertainment venues (p<0.001) are
    significant. CCTV count is not.
  condition: >-
    Same OLS fit. Every variable has a VIF below 5, so the coefficients are not
    distorted by collinearity.

- id: crime-streetlight
  kind: scope
  body: >-
    Streetlight counts were published for only some districts. The rest were
    estimated from electricity use, so that one variable is weaker than the others.

# ── Research ──────────────────────────────────────────────────────────────

- id: ieee-position
  kind: source
  body: >-
    Fourth of seven authors on the survey, under review. The position is stored
    as a number so it cannot drift into a different claim.
  href: https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=9078688

- id: ieee-beam-section
  kind: scope
  body: >-
    Section III.E, Beam Prediction, is the section I wrote — the survey's
    treatment of beam prediction as a time-series problem for language models.

- id: beam-reprogramming
  kind: scope
  body: >-
    The approach the section covers: beam indices and departure angles are
    patch-embedded, reprogrammed into tokens the model already knows, and
    prefixed with domain knowledge, the task, and the series statistics.

- id: bp-llm-training
  kind: measurement
  body: >-
    A frozen GPT-2 reprogrammed for beam prediction, 339,338 trainable
    parameters, training loss 2.08 to 0.0009 over ten epochs.
  condition: >-
    Training loss only. No train/validation/test split and no evaluation metric
    were implemented, so there is no accuracy figure to report.

- id: teaching-assistant
  kind: source
  body: >-
    Ran the weekly C programming lab for one semester — two hours a week, five
    assignments written and graded, exams invigilated.
  href: https://www.hanyang.ac.kr/

