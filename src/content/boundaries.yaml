# Section 7 of the document. These are rendered at the same weight as the
# results, not shrunk into a disclaimer at the bottom.

- id: never-operated
  claim: I have never operated a production system.
  detail: >-
    Everything on this site was deployed and demonstrated. None of it carried
    real users under load, and none of it has an on-call history, an incident
    record or an availability figure behind it. Deployed is not operated, and
    the difference is most of what production experience means.
  scope: global

- id: no-ci
  claim: I did not build the CI/CD pipeline on any of these projects.
  detail: >-
    On Dartoo the pipeline was a teammate's work and never covered the services
    I owned. I write tests and run them locally; wiring them into a pipeline
    someone else maintains is not the same skill, and I have not done it.
  scope: dartoo

- id: kubernetes-depth
  claim: My Kubernetes experience is manifests, not clusters.
  detail: >-
    I wrote deployment manifests and fixed configuration reference errors in
    them. I have not provisioned a cluster, debugged one under load, or been
    responsible for one. Treat any Kubernetes line on my CV as that and nothing
    more.
  scope: global

- id: agent-untested
  claim: The MAP recommendation agent has no tests.
  detail: >-
    It is at v0.0.1-poc. The test figures on that project belong to the gateway
    service. The agent's contract validation is real and its coverage is zero,
    and those are two different statements.
  scope: map

- id: bff-auth-unfinished
  claim: Authentication in the MAP Java BFF is a placeholder.
  detail: >-
    The token handling I describe is the Python side. The BFF's auth path is an
    AuthPlaceholder that was never completed, so the service is not something
    I would describe as having an authentication layer.
  scope: map

- id: rl-single-slice
  claim: Most of the pricing paper's headline gain comes from one slice.
  detail: >-
    97% of the revenue difference at the headline setting comes from the eMBB
    slice alone. The aggregate figure is accurate and, read without the
    decomposition, misleading. The decomposition is in the paper for that reason.
  scope: network-pricing

- id: bp-llm-unevaluated
  claim: The beam prediction model was never evaluated.
  detail: >-
    No train/validation/test split, no metric. The training loss fell, which
    tells you the model fitted what it saw and nothing about whether it
    predicts. There is no accuracy number because there is no accuracy
    measurement.
  scope: bp-llm

- id: examiner-unevaluated
  claim: examiner has no evaluation set.
  detail: >-
    I cannot tell you how often its verdicts are correct, because I never
    measured it. It demonstrates a design for bounding a model's confidence; it
    is not a tool whose output anyone should rely on.
  scope: examiner

- id: ar-never-on-device
  claim: The AR project has never run on a phone.
  detail: >-
    Verified against simulated input and a laptop webcam. I do not own a
    compatible device, so the last milestone is outstanding and the project is
    paused there.
  scope: mobile-ar

- id: attribution-by-surface
  claim: I attribute work by surface, never by commit share.
  detail: >-
    On the same repository my commit share moves between 14% and 89% depending
    on which branch you count and which of my git identities you include. A
    number that unstable cannot be defended, so ownership on this site names the
    services and repositories I was responsible for instead.
  scope: global
