- id: cinema-fall
  kind: measurement
  body: >-
    수집 자료의 2021년 매출은 2019년 정점 대비 87.6%, 관객 수는 88.9% 줄었습니다.
    관객 수는 2억 2,700만 명에서 2,500만 명으로 감소했습니다.
  condition: >-
    2004–2021년 전국 박스오피스 시계열을 국내외 개봉작 합산으로 연도별
    집계해, 연구 자체 데이터에서 재계산했습니다.

- id: cinema-correlation
  kind: measurement
  body: >-
    스크린 수와 권역 점유율의 상관은 세 체인에서 각각 r = 0.684, 0.569,
    0.550입니다. 세 계수 모두 p < 0.05에서 유의하지 않았으며 가장 작은 p값은
    0.061입니다.
  condition: >-
    8개 권역에 대한 Pearson r을 연구의 권역별 표에서 재계산했습니다. 1인당
    소비와 점유율도 같은 양상입니다.

