# Render Blueprint — Astro static site.
#
# autoDeployTrigger is not optional here. The previous portfolio's blueprint had
# no auto-deploy field at all, which left the service on manual deploys: pushes
# landed on GitHub and the live site stayed on a three-week-old commit until
# someone clicked Deploy in the dashboard. Setting it explicitly avoids
# repeating that.
services:
  - type: web
    name: ryu-jemu-marginalia
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit # commit | checksPass | off — replaces the deprecated `autoDeploy`
    envVars:
      - key: NODE_VERSION
        value: 24.14.1 # matches .node-version; Astro 7 requires >= 22.12.0
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # No SPA rewrite. build.format is 'directory', so every route is emitted as
    # its own index.html and deep links resolve natively; a catch-all rewrite
    # would break them and swallow the 404.
