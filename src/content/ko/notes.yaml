# ── 5G 가격 결정 강화학습 ─────────────────────────────────────────────────

- id: rl-uplift
  kind: measurement
  body: >-
    max-price 기준선 대비 학습된 정책이 m=1에서 2.1%, m=3에서 105.8%, m=5에서
    195.8%, m=10에서 363.2% 높았습니다.
  condition: >-
    시뮬레이션 환경, 이탈 민감도 계수 m. m=3·5·10은 각각 p<0.001에서 유의하며
    m=1은 p=0.472입니다.

- id: rl-embb-attribution
  kind: measurement
  body: >-
    m=3 매출 격차의 97%는 eMBB에서 발생했습니다. 이 조건의 eMBB 유지율은
    PPO 88.8%, 기준선 3.3%입니다.
  condition: >-
    대표 비교와 같은 실행을 slice별 매출로 분해했습니다.

- id: rl-myopic
  kind: measurement
  body: >-
    할인율 0으로 즉시 보상만 학습한 Myopic-PPO와 최대 가격 기준선의 차이는
    모든 실험 조건 m에서 유의하지 않았습니다.
  condition: >-
    본 비교와 같은 환경과 seed입니다. 학습 알고리즘과 미래 고려를 분리하는
    대조군입니다.

- id: rl-algorithms
  kind: measurement
  body: >-
    m=1에서 순보상은 PPO 7,334, SAC 7,370, TD3 6,862입니다. 결정론적 방법은
    PPO보다 6.4% 낮고, SAC는 PPO와 구분되지 않습니다.
  condition: >-
    같은 환경, 정책당 seed 3개, PPO와 SAC 사이는 p=0.938입니다. SAC와 TD3는
    m=1에서만 실행했습니다.

- id: rl-award
  kind: source
  body: >-
    제1저자. 한국정보처리학회 ASK 2026 춘계학술발표대회 논문 경진대회 은상.
    논문 C2026A0229, 과제 NRF RS-2024-00336983.
  href: https://github.com/Ryu-Jemu/network-pricing

# ── 서울 범죄 요인 분석 ───────────────────────────────────────────────────

- id: crime-model
  kind: measurement
  body: >-
    다섯 개 변수가 서울 25개 자치구 범죄 변동의 84%를 설명합니다. R² 0.843,
    조정 R² 0.801입니다.
  condition: >-
    25개 자치구 OLS이며, LassoCV와 RidgeCV 5-fold로 교차 확인했습니다.

- id: crime-significant
  kind: measurement
  body: >-
    인구(p=0.0006)와 유흥주점 수(p=0.0004)가 유의합니다. CCTV 수는 p=0.297로
    유의하지 않습니다.
  condition: >-
    같은 OLS 적합을 연구 자체 데이터로 재적합했습니다. 다섯 변수의 VIF는
    1.10에서 2.61 사이로, 이 적합에서 강한 다중공선성 신호는 없었습니다. 인과효과를 입증한 것은 아닙니다.

- id: crime-residuals
  kind: measurement
  body: >-
    모형은 성동구를 1,862건 과대 예측하고 마포구를 1,387건 과소 예측했습니다.
    두 자치구의 잔차 차이는 3,249건입니다.
  condition: >-
    같은 OLS 적합의 자치구별 실측값에서 예측값을 뺀 값입니다.

- id: crime-streetlight
  kind: scope
  body: >-
    가로등 수는 일부 자치구만 공개돼 있어 나머지는 전력 사용량에서
    추정했습니다. 그래서 이 변수 하나는 다른 변수보다 근거가 약합니다.

