- id: dartoo-normaliser
  kind: scope
  body: >-
    The ingestion producer detects ZIP, HTML and XML, selects encoding candidates,
    normalises legacy aliases and rewrites text and declarations as UTF-8.
    The object path and file metadata accompany downstream tasks.

- id: dartoo-ownership
  kind: scope
  body: >-
    Implementation across ingestion, disclosure and notification; integration
    and hardening in the shared summary service. Additional Java User work
    covers internal notification APIs and structured payload fields.

- id: dartoo-notification-scope
  kind: scope
  body: >-
    Notification specifically contains the SHA-256 event key, ten-step
    orchestration and seven-day-TTL DLQ. The key includes event type,
    receipt number and timestamp; it is not an exactly-once push guarantee.

- id: dartoo-lua-scope
  kind: scope
  body: >-
    Summary specifically combines INCR and EXPIRE in Redis Lua to remove the
    gap between client calls. The counter uses Asia/Seoul time and allows
    processing when Redis fails.

- id: dartoo-award
  kind: source
  body: >-
    Grand Prize, IT/CSE applied research and development, Hanyang University
    SW/ICT/AI conference, December 2025.
  href: https://dartoo.co.kr

# ── MAP ───────────────────────────────────────────────────────────────────

- id: map-terminal-state
  kind: scope
  body: "Acceptance inserts a missing job; completion updates its terminal result. The two writes use separate rules so a late acceptance does not overwrite a completed job."

- id: map-rate-limit
  kind: scope
  body: "Authenticated re-search uses an account key, with a default limit of three per day and KST-midnight expiry. Redis counter errors deliberately fail open; the key change is in the 2026-09-19 source."

- id: map-cache-tiers
  kind: scope
  body: "2026-09-20 source: Redis L1 plus scheduled PostgreSQL/PostGIS prefetch. Course normalization uses source IDs, coordinate geometry, upserts and geography radius queries. Forecast lookup selects a subscribed grid within the same province."

- id: map-llm-budget
  kind: scope
  body: "Normal recommendation uses one selection and one explanation call within a three-call budget. The supplied-place route bypasses both; order changes require explicit optimize. Current source, 2026-09-20."

- id: map-ownership
  kind: scope
  body: "Role confirmed 2026-09-20: architecture through app submission, excluding design and initial frontend setup. Selected diffs distinguish my work from teammates’ initial authentication, cache, vision and app features."

- id: map-store-review
  kind: scope
  body: "Store submission and pending review confirmed by the project owner on 2026-09-20. Saved release records separately verify signed artifacts and an earlier Transporter delivery. Public availability has not been claimed."

# ── Reinforcement learning for 5G pricing ─────────────────────────────────

- id: rl-uplift
  kind: measurement
  body: >-
    Against a max-price baseline the learned policy gains 2.1% at m=1, 105.8% at
    m=3, 195.8% at m=5 and 363.2% at m=10.
  condition: >-
    Simulated environment, churn-sensitivity multiplier m. Each of m=3, 5 and 10 is
    significant at p<0.001; the m=1 result is p=0.472.

- id: rl-embb-attribution
  kind: measurement
  body: >-
    97% of the m=3 revenue gap comes from the eMBB slice alone, and eMBB
    retention holds at 88.8% against the baseline's 3.3%.
  condition: >-
    Revenue decomposed by slice over the same runs as the headline comparison.

- id: rl-myopic
  kind: measurement
  body: >-
    Myopic-PPO, trained with a zero discount factor on immediate rewards only,
    did not differ significantly from the max-price baseline at any tested m.
  condition: >-
    Same environment and seeds as the main comparison. This is the control that
    isolates foresight from the learning algorithm.

- id: rl-algorithms
  kind: measurement
  body: >-
    At m=1 the net rewards are PPO 7,334, SAC 7,370 and TD3 6,862. The
    deterministic method is 6.4% below PPO; SAC is indistinguishable from it.
  condition: >-
    Same environment, three seeds per policy, p=0.938 between PPO and SAC. SAC
    and TD3 were run at m=1 only.

- id: rl-award
  kind: source
  body: >-
    First author. Silver award, paper competition, KIPS ASK 2026 spring
    conference. Paper C2026A0229, grant NRF RS-2024-00336983.
  href: https://github.com/Ryu-Jemu/network-pricing

# ── Seoul crime factor analysis ───────────────────────────────────────────

- id: crime-model
  kind: measurement
  body: >-
    Five variables explain 84% of the variation in crime across Seoul's 25
    districts — R² 0.843, adjusted 0.801.
  condition: >-
    OLS across 25 districts, cross-checked with LassoCV and RidgeCV at 5 folds.

- id: crime-significant
  kind: measurement
  body: >-
    Population (p=0.0006) and the count of entertainment venues (p=0.0004) are
    significant. CCTV count is not, at p=0.297.
  condition: >-
    Same OLS fit, refit from the study's own data. Variance inflation runs from
    1.10 to 2.61 across the five variables, which does not indicate strong
    multicollinearity in this fit; it does not establish causation.

- id: crime-residuals
  kind: measurement
  body: >-
    The model over-predicts Seongdong by 1,862 crimes and under-predicts Mapo by
    1,387. The difference between these residuals is 3,249 crimes.
  condition: >-
    Actual minus predicted, per district, from the same OLS fit.

- id: crime-streetlight
  kind: scope
  body: >-
    Streetlight counts were published for only some districts. The rest were
    estimated from electricity use, so that one variable is weaker than the others.

# ── Multiplex revenue analysis ────────────────────────────────────────────

- id: cinema-fall
  kind: measurement
  body: >-
    In the collected dataset, revenue fell 87.6% from the 2019 peak to 2021, and admissions
    88.9% — from 227 million to 25 million.
  condition: >-
    National box-office series 2004–2021, summed per year across domestic and
    foreign releases, recomputed from the study's own dataset.

- id: cinema-correlation
  kind: measurement
  body: >-
    Screen count against regional share gives r = 0.684, 0.569 and 0.550 for the
    three chains. None reaches p < 0.05, the closest being p = 0.061.
  condition: >-
    Pearson's r across eight regions, recomputed from the study's regional
    tables. Per-capita consumption against share behaves the same way.

