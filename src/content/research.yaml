# authorPosition is stored as {index, of} rather than as prose, so the position
# is rendered mechanically and cannot drift into a different claim.
#
# `materials` point at files the site serves itself:
#   kind: pdf     -> public/papers/<file>.pdf
#   kind: figure  -> src/assets/papers/<file>.(png|jpg|webp)
# An entry whose file is not there yet is skipped at build time rather than
# failing, so the record can be written before the file arrives.

- id: ask-2026
  title: >-
    Reinforcement-learning-based three-part tariff optimisation for 5G network
    slicing
  venue: KIPS ASK 2026 spring conference
  authorPosition: { index: 1, of: 2 }
  status: accepted
  date: "2026.05"
  manuscriptId: C2026A0229
  grant: NRF RS-2024-00336983
  award: Silver award, paper competition
  summary: >-
    Prices two network slices under a three-part tariff against their own effect
    on churn, and separates the contribution of foresight from the contribution
    of the learning algorithm.
  role:
    - "Formulated the problem: two slices priced under a subscription fee, an included allowance and an overage rate, with churn responding to price."
    - Built the simulation environment, its demand and churn dynamics, and its calibration.
    - Ran every experiment — the churn-sensitivity sweep, the algorithm comparison across five seeds each, and the myopic control.
    - Wrote the paper and prepared the submission.
  method:
    - A churn-sensitivity multiplier m is swept rather than fixed, so the result is a curve instead of a single number.
    - PPO, SAC and TD3 are compared on the same environment and the same five seeds.
    - The control is the same algorithm with the discount factor set to zero — able to learn, unable to look ahead.
    - Revenue is decomposed by slice, so an aggregate figure cannot hide a one-slice result.
  findings:
    - Against a max-price baseline the policy gains 2.1% at m=1, 105.8% at m=3, 195.8% at m=5 and 363.2% at m=10. Only m≥3 is significant at p<0.001.
    - 97% of the m=3 revenue gap comes from the eMBB slice alone, and eMBB retention holds at 88.8% against the baseline's 3.3%.
    - The myopic control is indistinguishable from the baseline at every m, which places the advantage in the foresight rather than in the algorithm.
    - TD3 lands 6.5% below the on-policy method; SAC is statistically indistinguishable from it (p=0.938).
  materials:
    - kind: pdf
      src: /papers/ask-2026.pdf
      label: Paper (PDF)
      caption: KIPS ASK 2026 spring conference, C2026A0229.
    - kind: figure
      src: ask-2026-uplift.png
      label: Revenue uplift by churn sensitivity
    - kind: figure
      src: ask-2026-slice.png
      label: Revenue decomposed by slice
    - kind: link
      src: https://github.com/Ryu-Jemu/network-pricing
      label: Environment and experiment code
  highlights:
    - The advantage grows with churn sensitivity and disappears where customers are insensitive to price.
    - A myopic control trained without foresight is indistinguishable from the fixed baseline.
    - The revenue gap is decomposed by slice, and the decomposition is in the paper.
  notes:
    - rl-uplift
    - rl-embb-attribution

- id: ieee-tai-survey
  title: Large language model-based optimisation for wireless communication — a survey
  venue: IEEE Transactions on Artificial Intelligence
  authorPosition: { index: 4, of: 7 }
  status: under-review
  date: "2026"
  manuscriptId: TAI-2026-Mar-R-00629
  contribution: Section III.E — Beam Prediction
  summary: >-
    A survey of language-model approaches to wireless resource problems, covering
    power control, bandwidth allocation, edge computing and beam prediction.
  role:
    - Wrote Section III.E, Beam Prediction, in full — the section's argument, its taxonomy of approaches and its discussion.
    - Argued that beamforming for non-stationary devices is where recurrent baselines stop generalising, which is the gap the section is built on.
    - Argued the reformulation the section rests on — a beam sequence is a time series, so beam selection is a forecasting problem a language model can be pointed at.
    - Covered patch embedding of beam indices and departure angles, reprogramming them into tokens the model already holds, and prompt-as-prefix conditioning on domain knowledge, task and series statistics.
    - Reviewed and corrected the manuscript, including three references whose identifiers pointed at unrelated papers.
  method:
    - The section compares reprogramming a frozen general model against training a sequence model from scratch, and states what each buys.
    - Conditioning is treated as three separate prefixes — domain knowledge, the task, and the statistics of the series — rather than one prompt.
  findings:
    - Beam prediction is presented as a forecasting problem rather than a classification one, which is what makes a language model applicable to it at all.
    - Reprogramming reuses a frozen model's learned sequence structure, so the trainable parameter count stays small relative to the model.
  materials:
    - kind: figure
      src: ieee-tai-beam-architecture.png
      label: Beam prediction — reprogramming architecture
      caption: From Section III.E.
    - kind: figure
      src: ieee-tai-prompt.png
      label: Prompt-as-prefix conditioning
  highlights:
    - Wrote Section III.E, Beam Prediction — why a beam sequence is a forecasting problem, and what a language model brings to it that an LSTM does not.
    - Covered patch embedding of beam indices and departure angles, reprogramming them into tokens the model already holds, and prompt-as-prefix conditioning on domain knowledge, task and series statistics.
    - Reviewed and corrected the manuscript, including three references whose identifiers pointed at unrelated papers.
  notes:
    - ieee-position
    - ieee-beam-section
    - beam-reprogramming

- id: bp-llm-lab
  title: Beam prediction with reprogrammed language models
  venue: ICI Lab, Hanyang University ERICA
  authorPosition: { index: 1, of: 1 }
  status: assisting
  date: "2025 – 2026"
  summary: >-
    The implementation behind the survey section — a frozen GPT-2 reprogrammed
    for a millimetre-wave beam sequence. Training ran; evaluation was never
    implemented.
  role:
    - Prepared the beam sequence data — indices and departure angles, patched into fixed-length windows.
    - Built the reprogramming layer over a frozen GPT-2 and the prompt-as-prefix conditioning.
    - Ran training and recorded the loss curve.
  findings:
    - 339,338 trainable parameters over a frozen backbone; training loss fell from 2.08 to 0.0009 across ten epochs.
    - No train/validation/test split and no evaluation metric were implemented, so there is no accuracy figure and the loss curve is the only result.
  materials:
    - kind: figure
      src: bp-llm-loss.png
      label: Training loss over ten epochs
  notes:
    - bp-llm-training
