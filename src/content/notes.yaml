- id: ieee-beam-section
  kind: scope
  body: >-
    Section III.E, Beam Prediction, is the section I wrote — the survey's
    treatment of beam prediction as a time-series problem for language models.

- id: beam-reprogramming
  kind: scope
  body: >-
    The approach the section covers: beam indices and departure angles are
    patch-embedded, reprogrammed into tokens the model already knows, and
    prefixed with domain knowledge, the task, and the series statistics.

- id: bp-llm-training
  kind: measurement
  body: >-
    A frozen GPT-2 reprogrammed for beam prediction, 339,338 trainable
    parameters, training loss 2.0826 to 0.0009 over ten epochs.
  condition: >-
    Average loss per epoch from the run log, 20,000 of 84,019 built samples,
    34 minutes on Apple silicon. Training loss only — no held-out split was
    implemented, so there is no accuracy figure to report.

- id: bp-llm-data
  kind: measurement
  body: >-
    378 ray-traced sets from the DeepMIMO o1_28 scenario became 84,019 sliding
    windows — forty past steps against ten future ones.
  condition: >-
    Counted from the preprocessing run log. Sets whose beam search returned an
    empty sequence were skipped rather than filled in.

