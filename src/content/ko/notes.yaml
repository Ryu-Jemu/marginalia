- id: ieee-beam-section
  kind: scope
  body: >-
    제가 쓴 부분은 Section III.E, Beam Prediction입니다. 빔 예측을 언어 모델을
    위한 시계열 문제로 다루는 절입니다.

- id: beam-reprogramming
  kind: scope
  body: >-
    해당 절이 다루는 접근입니다. 빔 인덱스와 출발각을 patch embedding하고,
    모델이 이미 아는 토큰으로 reprogramming한 뒤, 도메인 지식과 과제 설명,
    시계열 통계를 prefix로 붙입니다.

- id: bp-llm-training
  kind: measurement
  body: >-
    빔 예측용으로 reprogramming한 frozen GPT-2입니다. 학습 가능한 파라미터는
    339,338개, 학습 손실은 10 epoch 동안 2.0826에서 0.0009로 내려갔습니다.
  condition: >-
    run log의 epoch 평균 손실이며, 생성된 84,019개 샘플 중 20,000개를 Apple
    silicon에서 34분간 학습했습니다. 학습 손실뿐이고, held-out 분할을
    구현하지 않아 보고할 평가 지표가 없습니다.

- id: bp-llm-data
  kind: measurement
  body: >-
    DeepMIMO o1_28 시나리오의 ray-tracing 세트 378개가 sliding window
    84,019개가 됐습니다. 과거 40스텝에 대해 미래 10스텝입니다.
  condition: >-
    전처리 run log에서 집계했습니다. beam search가 빈 시퀀스를 반환한 세트는
    값을 채우지 않고 건너뛰었습니다.

- id: teaching-assistant
  kind: source
  body: >-
    한 학기 동안 주 2시간 C 프로그래밍 실습을 맡았습니다. 과제 5건을
    출제·채점하고 시험을 감독했습니다.
  href: https://www.hanyang.ac.kr/

