# src/content/research.yaml의 한국어 미러. id와 순서, 구조는 영어판과 같고
# authorPosition, status, date, manuscriptId, grant, materials[].src는 그대로 옮긴다.

- id: ask-2026
  title: >-
    강화학습 기반 5G 네트워크 슬라이싱의 Three-Part Tariff 동적 가격 최적화
  venue: 한국정보처리학회 ASK 2026 춘계학술발표대회
  authorPosition: { index: 1, of: 2 }
  status: accepted
  date: "2026.05"
  manuscriptId: C2026A0229
  grant: NRF RS-2024-00336983
  award: 논문 경진대회 은상
  summary: >-
    가격에 따른 고객 이탈을 반영해 두 네트워크 슬라이스의 3부 요금제를 최적화했습니다.
    알고리즘 비교와 할인율 대조 실험으로 장기 보상을 고려하는 효과를 분석했습니다.
  role:
    - "구독료·기본 제공량·초과 요금과 가격에 따른 고객 이탈을 의사결정 문제로 정식화했습니다."
    - "수요와 이탈 모형을 포함한 시뮬레이션 환경을 구현하고 매개변수를 보정했습니다."
    - "이탈 민감도별 실험, m=1의 알고리즘 비교와 할인율 0 대조 실험을 수행했습니다."
    - "제1저자로 논문을 작성하고 투고했습니다."
  method:
    - "이탈 민감도 m=1·3·5·10에서 최대 가격 기준선 대비 수익을 비교했습니다."
    - "m=1에서 PPO·SAC·TD3를 동일 환경과 시드 3개로 비교했습니다."
    - "즉시 보상만 학습하는 할인율 0의 Myopic-PPO로 장기 보상 고려의 효과를 확인했습니다."
    - "슬라이스별 수익을 분리해 전체 수익 격차의 기여도를 계산했습니다."
  findings:
    - "최대 가격 기준선 대비 정책의 이득은 m=1에서 2.1%, m=3에서 105.8%, m=5에서 195.8%, m=10에서 363.2%입니다. m=3·5·10은 각각 p<0.001에서 유의합니다."
    - "m=3 수익 격차의 97%는 eMBB에서 발생했습니다. 해당 조건의 eMBB 유지율은 PPO 88.8%, 기준선 3.3%입니다."
    - "Myopic-PPO와 기준선의 차이는 모든 m에서 유의하지 않았습니다. 이 실험은 장기 보상 고려가 수익 차이에 기여한다는 해석을 뒷받침합니다."
    - "m=1에서 순 보상은 PPO 7,334, SAC 7,370, TD3 6,862이고 Max-Price는 7,183입니다. 결정론적 기법은 PPO보다 6.4% 낮고, SAC는 p=0.938로 PPO와 구별되지 않습니다."
  implementation:
    project: network-pricing
    summary: >-
      논문의 시뮬레이션 환경과 모든 실험을 하나의 저장소로 작성했습니다.
    points:
      - "Gymnasium 환경에서 두 슬라이스의 3부 요금제와 가격에 따른 수요·이탈 변화를 구현했습니다."
      - "PPO·SAC·TD3가 동일 환경과 시드 3개를 사용하도록 실험 코드를 구성했습니다."
      - "Myopic-PPO의 할인율을 0으로 설정해 즉시 보상만 고려하는 대조군을 구현했습니다."
      - "슬라이스별 수익을 집계하고 전체 격차에 대한 기여도를 시각화했습니다."
  materials:
    - kind: pdf
      src: /papers/ask-2026.pdf
      label: 논문 (PDF)
      caption: 한국정보처리학회 ASK 2026 춘계학술발표대회, C2026A0229.
    - kind: link
      src: https://github.com/Ryu-Jemu/network-pricing
      label: 환경 및 실험 코드
  highlights:
    - "최대 가격 기준선 대비 수익 증가율은 이탈 민감도에 따라 커졌으며, m=1의 차이는 유의하지 않았습니다."
    - "즉시 보상만 학습한 Myopic-PPO와 최대 가격 기준선의 차이는 유의하지 않았습니다."
    - "슬라이스별 수익 기여도를 계산해 m=3 격차의 97%가 eMBB에서 발생함을 확인했습니다."
  notes:
    - rl-uplift
    - rl-embb-attribution

- id: ieee-tai-survey
  title: 무선 통신을 위한 LLM 기반 최적화 — 서베이
  venue: IEEE Transactions on Artificial Intelligence
  authorPosition: { index: 4, of: 7 }
  status: under-review
  date: "2026.08"
  manuscriptId: TAI-2026-Aug-R-01847
  contribution: III.E절 — 빔 예측
  summary: >-
    무선 자원 문제에 언어 모델을 적용한 연구를 정리한 서베이입니다.
    빔 예측 절 집필과 해당 모델 구현을 담당했습니다.
  role:
    - "III.E절 빔 예측의 논지, 접근 방식 분류와 논의를 집필했습니다."
    - "빔 시퀀스를 시계열 입력으로 정리하고 언어 모델을 활용한 예측 접근을 검토했습니다."
    - "DeepMIMO 전처리 파이프라인, BP-LLM 모델, 학습 루프와 cascaded LSTM 기준선을 구현했습니다."
    - "원고를 검토하고, 식별자가 다른 논문을 가리키던 참고문헌 세 건을 수정했습니다."
  method:
    - "빔 인덱스와 출발각을 패치로 나눠 임베딩하고, 모델의 어휘에서 가져온 프로토타입 토큰으로 재프로그래밍합니다."
    - "프롬프트 프리픽스에 도메인 지식, 과제 설명과 입력 시계열의 통계를 담습니다."
    - "GPT-2는 동결하고 임베딩·재프로그래밍 계층과 출력 사영을 평균제곱오차로 학습합니다."
    - "로컬 구현에는 학습 루프와 LSTM 기준선이 있으며, held-out 평가 분할은 구현되지 않았습니다."
  highlights:
    - "III.E절 집필과 빔 예측 접근 방식의 분류."
    - "DeepMIMO 전처리, 패치 임베딩, 토큰 재프로그래밍과 프롬프트 프리픽스 구성."
    - "원고와 참고문헌 식별자 검토."
  implementation:
    project: bp-llm
    summary: >-
      밀리미터파 빔 시퀀스를 위해 동결한 GPT-2를 재프로그래밍하고,
      DeepMIMO 데이터 전처리부터 학습까지 구현했습니다.
    points:
      - "전처리 실행에서 DeepMIMO o1_28의 28 GHz 레이 트레이싱 378세트를 과거 40스텝·미래 10스텝의 슬라이딩 윈도 84,019개로 변환했습니다. Saleh-Valenzuela 채널 모델과 32점 DFT 코드북으로 빔 레이블을 생성했습니다."
      - "가역 정규화, 패치 임베딩과 변수 간 attention으로 빔 인덱스·출발각을 256개 텍스트 프로토타입에 연결하고 GPT-2는 동결했습니다."
      - "학습 로그 기준으로 생성 샘플 중 20,000개와 학습 가능 파라미터 339,338개를 사용했습니다. 에포크 평균 학습 손실은 10에포크 동안 2.0826에서 0.0009로 내려갔으며 Apple silicon에서 34분이 걸렸습니다."
      - "cascaded LSTM 기준선은 같은 전처리와 학습 코드를 사용합니다."
      - "정규화 통계와 학습 손실이 같은 인덱스를 사용합니다. held-out 분할과 평가 지표는 미구현이므로 학습 손실을 예측 성능으로 해석하지 않습니다."
  notes:
    - ieee-position
    - ieee-beam-section
    - beam-reprogramming
    - bp-llm-training
    - bp-llm-data
